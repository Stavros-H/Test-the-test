<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Smarts - Attempt History</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Speed Smarts</h1>
            <p>Your Quiz Attempt History</p>
        </header>
        
        <nav>
            <a href="/" class="btn">Home</a>
            <a href="/dashboard" class="btn">Dashboard</a>
            <a href="/quizzes" class="btn">Quizzes</a>
            <a href="/" id="logoutBtn" class="btn">Logout</a>
        </nav>
        
        <main>
            <section class="history-section">
                <h2>Your Attempt History</h2>
                <p>Only completed attempts are shown below.</p>
                
                <div id="historyContent">
                    <p class="loading">Loading your attempt history...</p>
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2024 Speed Smarts</p>
        </footer>
    </div>
    
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check authentication
            try {
                const response = await fetch('/api/auth/me');
                if (!response.ok) {
                    window.location.href = '/login';
                    return;
                }
            } catch (err) {
                window.location.href = '/login';
                return;
            }
            
            // Setup logout
            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    await fetch('/api/auth/logout', { method: 'POST' });
                    window.location.href = '/login';
                } catch (err) {
                    console.error('Logout error:', err);
                }
            });
            
            // Load attempt history
            await loadHistory();
        });
        
        async function loadHistory() {
            try {
                const response = await fetch('/api/attempts');
                
                if (!response.ok) {
                    const error = await response.json();
                    document.getElementById('historyContent').innerHTML = `
                        <div class="error-message show">
                            ${error.error || 'Failed to load history'}
                        </div>
                    `;
                    return;
                }
                
                const data = await response.json();
                const attempts = data.attempts;
                
                if (attempts.length === 0) {
                    document.getElementById('historyContent').innerHTML = `
                        <div class="history-empty">
                            <p>You haven't completed any quizzes yet.</p>
                            <p><a href="/quizzes" class="btn btn-primary">Take a Quiz Now</a></p>
                        </div>
                    `;
                    return;
                }
                
                renderHistory(attempts);
            } catch (err) {
                console.error('Error loading history:', err);
                document.getElementById('historyContent').innerHTML = `
                    <div class="error-message show">
                        Failed to load history. Please try again.
                    </div>
                `;
            }
        }
        
        function renderHistory(attempts) {
            let html = '<div class="history-list">';
            
            attempts.forEach(attempt => {
                const percentageClass = attempt.percentage >= 70 ? 'high' : 
                                       attempt.percentage >= 50 ? 'medium' : 'low';
                
                html += `
                    <div class="history-item">
                        <div class="history-header">
                            <h3>${attempt.quiz_title}</h3>
                            <span class="history-date">${formatDate(attempt.completed_at)}</span>
                        </div>
                        <div class="history-details">
                            <div class="history-stat">
                                <span class="stat-label">Score:</span>
                                <span class="stat-value">${attempt.score} / ${attempt.question_count}</span>
                            </div>
                            <div class="history-stat">
                                <span class="stat-label">Percentage:</span>
                                <span class="stat-value percentage-${percentageClass}">${attempt.percentage}%</span>
                            </div>
                            <div class="history-stat">
                                <span class="stat-label">Points:</span>
                                <span class="stat-value">${attempt.points}</span>
                            </div>
                            <div class="history-stat">
                                <span class="stat-label">Status:</span>
                                <span class="stat-value">${attempt.timed_out ? 'Timed Out' : 'Completed'}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            document.getElementById('historyContent').innerHTML = html;
        }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>
</body>
</html>
